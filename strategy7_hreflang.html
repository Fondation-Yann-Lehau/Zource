<!DOCTYPE html>
<!-- Stratégie 7: Accessibilité linguistique avec hreflang -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stratégie 7 - Liens alternatifs hreflang</title>
    <link rel="alternate" hreflang="en" href="/en/page.html">
    <link rel="alternate" hreflang="es" href="/es/page.html">
    <link rel="alternate" hreflang="de" href="/de/page.html">
    <link rel="alternate" hreflang="x-default" href="/en/page.html">
</head>
<body>
    <h1>Versions Linguistiques Alternatives</h1>
    <p>Ce document déclare des versions alternatives en différentes langues:</p>
    <nav>
        <ul>
            <li><a href="/fr/page.html" hreflang="fr">Français</a></li>
            <li><a href="/en/page.html" hreflang="en">English</a></li>
            <li><a href="/es/page.html" hreflang="es">Español</a></li>
            <li><a href="/de/page.html" hreflang="de">Deutsch</a></li>
        </ul>
    </nav>
    <p>L'attribut hreflang améliore le SEO international.</p>
</body>
</html>
