<!DOCTYPE html>
<!-- Stratégie 3: Direction du texte (dir attribute) -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stratégie 3 - Direction du texte</title>
</head>
<body>
    <h1>Direction du Texte</h1>
    
    <h2>Texte gauche-à-droite (LTR):</h2>
    <p dir="ltr">Ce texte français s'affiche de gauche à droite.</p>
    
    <h2>Texte droite-à-gauche (RTL):</h2>
    <p dir="rtl" lang="ar">هذا النص العربي يظهر من اليمين إلى اليسار</p>
    
    <h2>Détection automatique:</h2>
    <p dir="auto">Text with mixed content مختلط</p>
</body>
</html>
