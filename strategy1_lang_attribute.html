<!DOCTYPE html>
<!-- Stratégie 1: Déclaration de langue (lang attribute) -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stratégie 1 - Attribut lang</title>
</head>
<body>
    <h1>Déclaration de Langue</h1>
    <p>Ce document est déclaré en français avec l'attribut lang="fr".</p>
    <p>Cela aide les moteurs de recherche et les technologies d'assistance à comprendre la langue du contenu.</p>
</body>
</html>
