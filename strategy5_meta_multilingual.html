<!DOCTYPE html>
<!-- Stratégie 5: Métadonnées multilingues -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="language" content="French">
    <meta http-equiv="content-language" content="fr">
    <title>Stratégie 5 - Métadonnées</title>
</head>
<body>
    <h1>Métadonnées Multilingues</h1>
    <p>Ce document utilise des balises meta pour déclarer la langue:</p>
    <ul>
        <li>meta name="language" content="French"</li>
        <li>meta http-equiv="content-language" content="fr"</li>
    </ul>
    <p>Ces métadonnées aident les moteurs de recherche à indexer correctement le contenu.</p>
</body>
</html>
