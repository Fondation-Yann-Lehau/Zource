<!DOCTYPE html>
<!-- Stratégie 6: Attributs translate -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stratégie 6 - Attribut translate</title>
</head>
<body>
    <h1>Contrôle de la Traduction</h1>
    
    <p translate="yes">Ce texte peut être traduit automatiquement.</p>
    
    <p>Mon nom est <span translate="no">Jean Dupont</span> et je travaille pour <span translate="no">International Telecommunications Union</span>.</p>
    
    <p>Code exemple: <code translate="no">console.log("Hello World");</code></p>
    
    <p translate="yes">Les noms propres et le code ci-dessus ne seront pas traduits grâce à translate="no".</p>
</body>
</html>
