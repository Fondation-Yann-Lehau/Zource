<!DOCTYPE html>
<!-- Stratégie 4: Balises de langue multiples -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stratégie 4 - Balises multilingues</title>
</head>
<body>
    <h1>Contenu Multilingue</h1>
    <p>Ce document contient du texte en plusieurs langues:</p>
    
    <p><span lang="en">Hello</span> - <span lang="fr">Bonjour</span> - <span lang="es">Hola</span></p>
    <p><span lang="de">Guten Tag</span> - <span lang="it">Ciao</span> - <span lang="pt">Olá</span></p>
    <p><span lang="zh">你好</span> - <span lang="ja">こんにちは</span> - <span lang="ar">مرحبا</span></p>
    <p><span lang="ru">Привет</span> - <span lang="hi">नमस्ते</span> - <span lang="ko">안녕하세요</span></p>
</body>
</html>
